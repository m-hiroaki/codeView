name: Row projection GUI validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/row-gui-validation.yml
      - tests/GuiProbe/**
      - tools/check_row_projection.py
      - tools/test_row_projection.py
      - src/codeView/Documents/DocumentRowProjection.cs
      - src/codeView/Documents/DocumentDisplaySession.cs
      - src/codeView/Documents/DocumentGraphemeIndex.cs
      - src/codeView/Documents/DocumentAdapter.cs
      - src/codeView/Presentation/MainWindow.axaml.cs
      - src/codeView/Presentation/MainWindowViewModel.cs
      - src/codeView/Operations/TabManager.cs

permissions:
  contents: read

jobs:
  gui:
    name: Row GUI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Prepare mixed long, empty and Unicode fixtures
        run: |
          New-Item -ItemType Directory -Force artifacts/row-gui-validation | Out-Null
          "Commit: $env:GITHUB_SHA; native control integration, physical paint/input not measured." | Out-File artifacts/row-gui-validation/environment.txt
          dotnet --info | Out-File artifacts/row-gui-validation/environment.txt -Append
          python -c "from pathlib import Path; p=Path('artifacts/row-gui-validation/inputs'); p.mkdir(); (p/'mixed.cs').write_bytes(('before\r\n'+'x'*(1024*1024)+'\r\n'+''.join('line'+str(i)+' 日本語😀\r\n' for i in range(100))).encode('utf-8')); (p/'empty.cs').write_bytes(b''); (p/'unicode.cs').write_bytes(('a\u0301日本語😀\tValue\r\nempty\rplain\n'*50).encode('utf-8'))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build dedicated row prototype
        run: |
          dotnet restore codeView.slnx --locked-mode -p:PublishAot=false -p:CodeViewPerformanceProbe=false -m:1 -nr:false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build src/codeView/codeView.csproj -c Release --no-restore -p:PublishAot=false -p:PublishTrimmed=false -p:CodeViewPerformanceProbe=true --output artifacts/row-gui-validation/app -m:1 -nr:false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Three sequential native processes per fixture
        run: |
          $app = if ($IsWindows) { 'artifacts/row-gui-validation/app/codeView.exe' } else { 'artifacts/row-gui-validation/app/codeView' }
          $platform = if ($IsWindows) { 'windows' } else { 'macos' }
          python -m unittest discover -s tools -p test_row_projection.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/check_row_projection.py --app $app --inputs artifacts/row-gui-validation/inputs/mixed.cs artifacts/row-gui-validation/inputs/empty.cs artifacts/row-gui-validation/inputs/unicode.cs --output artifacts/row-gui-validation/results --rounds 3 --commit $env:GITHUB_SHA --os $platform
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/check_row_projection.py --app $app --inputs artifacts/row-gui-validation/inputs/mixed.cs artifacts/row-gui-validation/inputs/empty.cs artifacts/row-gui-validation/inputs/unicode.cs --output artifacts/row-gui-validation/results-contextual --rounds 3 --commit $env:GITHUB_SHA --os $platform --contextual
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Measure large mixed and single-line viewport
        run: |
          $root = New-Item -ItemType Directory -Force artifacts/row-gui-validation/results-large
          python -c "from pathlib import Path; p=Path(r'$($root.FullName)'); line=b'x'*(50<<20); (p/'single.cs').write_bytes(line); (p/'mixed.cs').write_bytes(b'head\r\n'+line+b'\r\n'+b'after\r\n'*96)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $app = if ($IsWindows) { 'artifacts/row-gui-validation/app/codeView.exe' } else { 'artifacts/row-gui-validation/app/codeView' }
          $env:CODEVIEW_GUI_WINDOWED = '1'
          $env:CODEVIEW_GUI_INTERACTIVE = '1'
          $env:CODEVIEW_GUI_ROWS = '1'
          $env:CODEVIEW_GUI_ROW_CHECKS = '1'
          $env:CODEVIEW_GUI_ROW_LARGE_CHECKS = '1'
          foreach ($context in @('0', '1')) {
            $env:CODEVIEW_GUI_GRAPHEME_INDEX = $context
            foreach ($fixture in @('single', 'mixed')) {
              $env:CODEVIEW_GUI_PERF_REPORT = Join-Path $root.FullName "$fixture-$context.json"
              $child = Start-Process -FilePath $app -ArgumentList (Join-Path $root.FullName "$fixture.cs") -PassThru
              if (!$child.WaitForExit(90000)) { $child.Kill(); throw "Large row run timed out: $fixture/$context" }
              if ($child.ExitCode -ne 0) { throw "Large row run failed: $fixture/$context" }
              $result = Get-Content -Raw $env:CODEVIEW_GUI_PERF_REPORT | ConvertFrom-Json
              if ($result.Failure -or !$result.RowProjectionChecks.LargeFixture -or
                  $result.RowProjectionChecks.Contextual -ne ($context -eq '1') -or
                  $result.ScrollSynchronousMilliseconds.Count -ne 64 -or
                  $result.RowProjectionChecks.HorizontalPositionsVisited -ne 32 -or
                  ($fixture -eq 'mixed' -and $result.RowProjectionChecks.FirstLinesVisited -le 1)) {
                  throw "Missing large row evidence: $fixture/$context"
              }
              Write-Host "$fixture/$context attach=$($result.DocumentAttachmentMilliseconds) ms; max scroll=$(($result.ScrollSynchronousMilliseconds | Measure-Object -Maximum).Maximum) ms; memory=$($result.MemoryIncrease) bytes"
            }
          }
          Remove-Item (Join-Path $root.FullName 'mixed.cs'), (Join-Path $root.FullName 'single.cs')
      - name: Upload row integration evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: row-gui-${{ matrix.os }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            artifacts/row-gui-validation/environment.txt
            artifacts/row-gui-validation/inputs/
            artifacts/row-gui-validation/results/
            artifacts/row-gui-validation/results-contextual/
            artifacts/row-gui-validation/results-large/
