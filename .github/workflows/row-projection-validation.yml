name: Row projection core validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/row-projection-validation.yml
      - src/codeView/Documents/DocumentRowProjection.cs
      - src/codeView/Documents/DocumentDisplaySession.cs
      - src/codeView/Documents/DocumentAdapter.cs
      - tests/codeView.Tests/Documents/DocumentRowProjectionTests.cs
      - tests/codeView.Tests/Documents/RowProjectionPerformanceTests.cs

permissions:
  contents: read

jobs:
  core:
    name: Row core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Record environment
        run: |
          New-Item -ItemType Directory -Force artifacts/row-core-validation | Out-Null
          "Commit: $env:GITHUB_SHA; UI-free core, generated in-memory input, not physical rendering or file I/O." | Out-File artifacts/row-core-validation/environment.txt
          dotnet --info | Out-File artifacts/row-core-validation/environment.txt -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and verify source position invariants
        run: |
          dotnet restore codeView.slnx --locked-mode -p:PublishAot=false -p:CodeViewPerformanceProbe=false -m:1 -nr:false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test tests/codeView.Tests/codeView.Tests.csproj -c Release --no-restore --filter FullyQualifiedName~DocumentRowProjectionTests -p:PublishAot=false -p:CodeViewPerformanceProbe=false -m:1 -nr:false --logger "trx;LogFileName=unit.trx" --results-directory artifacts/row-core-validation
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Three sequential independent core processes
        run: |
          foreach ($round in 1..3) {
            dotnet test tests/codeView.Tests/codeView.Tests.csproj -c Release --no-build --no-restore --filter FullyQualifiedName~RowProjectionPerformanceTests --logger "console;verbosity=normal" --logger "trx;LogFileName=performance.trx" --results-directory "artifacts/row-core-validation/run-$round" 2>&1 | Tee-Object "artifacts/row-core-validation/run-$round.log"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Upload core evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: row-core-${{ matrix.os }}
          retention-days: 14
          if-no-files-found: warn
          path: artifacts/row-core-validation/
