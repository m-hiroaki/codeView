name: Semantic navigation validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/semantic-navigation-validation.yml
      - global.json
      - src/codeView/Navigation/**
      - src/codeView/Operations/**
      - src/codeView/Presentation/MainWindow*
      - src/codeView/Presentation/SearchPanelViewModel.cs
      - src/codeView/Search/WorkspaceSearch.cs
      - tests/GuiProbe/**
      - tests/codeView.Tests/Navigation/**
      - tests/codeView.Tests/Presentation/SemanticNavigationViewModelTests.cs
      - tools/check_reference_search.py

permissions:
  contents: read

jobs:
  semantic-navigation:
    name: Semantic navigation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Prepare language servers
        run: |
          $artifacts = Join-Path $PWD 'artifacts/semantic-navigation'
          New-Item -ItemType Directory -Force $artifacts | Out-Null
          $toolDirectory = Join-Path $artifacts 'tools'
          dotnet tool install roslyn-language-server --version 5.13.0-1.26514.10 --tool-path $toolDirectory
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $roslyn = if ($IsWindows) {
            # The generated tool shim is not necessarily an executable. Use the package's native entry point.
            (Get-ChildItem (Join-Path $toolDirectory '.store') -Recurse -Force -File -Filter 'roslyn-language-server.exe' |
              Select-Object -First 1).FullName
          } else { Join-Path $toolDirectory 'roslyn-language-server' }
          $clangd = (Get-Command clangd -ErrorAction SilentlyContinue).Source
          if (!$clangd -and $IsWindows) { $clangd = Join-Path $env:ProgramFiles 'LLVM/bin/clangd.exe' }
          if (!$clangd -or !(Test-Path -LiteralPath $clangd -PathType Leaf)) { throw 'clangd is missing' }
          if (!$roslyn -or !(Test-Path -LiteralPath $roslyn -PathType Leaf)) { throw 'Roslyn executable is missing' }
          "CODEVIEW_TEST_ROSLYN=$roslyn" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "CODEVIEW_TEST_CLANGD=$clangd" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          dotnet --info | Out-File (Join-Path $artifacts 'environment.txt')
          & $clangd --version | Out-File (Join-Path $artifacts 'environment.txt') -Append
      - name: Run semantic navigation integration tests
        id: integration
        run: |
          dotnet restore codeView.slnx --locked-mode -p:PublishAot=false -p:CodeViewPerformanceProbe=false -m:1 -nr:false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test codeView.slnx -c Release --no-restore -p:PublishAot=false -p:PublishTrimmed=false -m:1 -nr:false --filter 'FullyQualifiedName~LanguageServerSessionTests|FullyQualifiedName~RoslynNavigationTests|FullyQualifiedName~ClangdNavigationTests|FullyQualifiedName~SemanticResultMapperTests|FullyQualifiedName~SemanticNavigationViewModelTests' --logger 'trx;LogFileName=semantic-navigation.trx' --logger 'console;verbosity=normal' --blame-hang --blame-hang-timeout 60s --blame-hang-dump-type none --results-directory artifacts/semantic-navigation
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise application commands with real language servers
        if: ${{ !cancelled() && (success() || steps.integration.outcome == 'failure') }}
        run: |
          dotnet build src/codeView/codeView.csproj -c Release --no-restore -p:PublishAot=false -p:PublishTrimmed=false -p:CodeViewPerformanceProbe=true --output artifacts/semantic-navigation/app -m:1 -nr:false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $app = if ($IsWindows) { 'artifacts/semantic-navigation/app/codeView.exe' } else { 'artifacts/semantic-navigation/app/codeView' }
          python tools/check_reference_search.py --app $app --output artifacts/semantic-navigation/gui --commit $env:GITHUB_SHA --rounds 1 --semantic
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: semantic-navigation-${{ matrix.os }}
          retention-days: 14
          path: |
            artifacts/semantic-navigation/environment.txt
            artifacts/semantic-navigation/*.trx
            artifacts/semantic-navigation/gui/reference-*.json
            artifacts/semantic-navigation/gui/reference-*.log
            artifacts/semantic-navigation/gui/runs.json
