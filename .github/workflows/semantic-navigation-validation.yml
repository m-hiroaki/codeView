name: Semantic navigation validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/semantic-navigation-validation.yml
      - global.json
      - build-mac.sh
      - build-windows.bat
      - build/language-servers.json
      - build/licenses/Roslyn.txt
      - tools/package_language_servers.py
      - src/codeView/codeView.csproj
      - src/codeView/App.axaml.cs
      - src/codeView/Navigation/**
      - src/codeView/Operations/**
      - src/codeView/Presentation/MainWindow*
      - src/codeView/Presentation/SearchPanelViewModel.cs
      - src/codeView/Search/WorkspaceSearch.cs
      - tests/GuiProbe/**
      - tests/codeView.Tests/Navigation/**
      - tests/codeView.Tests/Presentation/SemanticNavigationViewModelTests.cs
      - tools/check_reference_search.py

permissions:
  contents: read

jobs:
  semantic-navigation:
    name: Semantic navigation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15, macos-15-intel]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Publish and relocate the Native AOT acceptance build
        env:
          CODEVIEW_SEMANTIC_PROBE: '1'
        run: |
          $evidence = Join-Path $PWD 'artifacts/semantic-navigation'
          $relocated = Join-Path $evidence 'moved 配布'
          New-Item -ItemType Directory -Force $relocated | Out-Null
          if ($IsWindows) {
            & cmd.exe /d /c build-windows.bat 2>&1 | Tee-Object (Join-Path $evidence 'publish.log')
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Copy-Item 'artifacts/semantic-probe/publish/win-x64/codeView' $relocated -Recurse
            $payload = Join-Path $relocated 'codeView'
            $app = Join-Path $payload 'codeView.exe'
            $roslyn = Join-Path $payload 'language-servers/roslyn/Microsoft.CodeAnalysis.LanguageServer.exe'
            $clangd = Join-Path $payload 'language-servers/clangd/bin/clangd.exe'
          } else {
            $rid = if ((uname -m) -eq 'arm64') { 'osx-arm64' } else { 'osx-x64' }
            & ./build-mac.sh $rid 2>&1 | Tee-Object (Join-Path $evidence 'publish.log')
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $payload = Join-Path $relocated 'codeView.app'
            ditto "artifacts/semantic-probe/publish/$rid/codeView.app" $payload
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            codesign --verify --deep --strict $payload
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $app = Join-Path $payload 'Contents/MacOS/codeView'
            $roslyn = Join-Path $payload 'Contents/Helpers/Roslyn.app/Contents/MacOS/Microsoft.CodeAnalysis.LanguageServer'
            $clangd = Join-Path $payload 'Contents/Helpers/clangd'
          }
          foreach ($file in @($app, $roslyn, $clangd)) {
            if (!(Test-Path -LiteralPath $file -PathType Leaf)) { throw "Missing relocated executable $file" }
          }
          "CODEVIEW_BUNDLED_APP=$app" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "CODEVIEW_TEST_ROSLYN=$roslyn" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "CODEVIEW_TEST_CLANGD=$clangd" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          dotnet --info | Out-File (Join-Path $evidence 'environment.txt')
          & $clangd --version | Out-File (Join-Path $evidence 'environment.txt') -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run semantic navigation integration tests
        id: integration
        run: |
          dotnet restore codeView.slnx --locked-mode -p:PublishAot=false -p:CodeViewPerformanceProbe=false -m:1 -nr:false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test codeView.slnx -c Release --no-restore -p:PublishAot=false -p:PublishTrimmed=false -m:1 -nr:false --filter 'FullyQualifiedName~LanguageServerSessionTests|FullyQualifiedName~RoslynNavigationTests|FullyQualifiedName~ClangdNavigationTests|FullyQualifiedName~SemanticResultMapperTests|FullyQualifiedName~SemanticNavigationViewModelTests' --logger 'trx;LogFileName=semantic-navigation.trx' --logger 'console;verbosity=normal' --blame-hang --blame-hang-timeout 60s --blame-hang-dump-type none --results-directory artifacts/semantic-navigation
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise application commands using the relocated bundle
        if: ${{ !cancelled() && (success() || steps.integration.outcome == 'failure') }}
        run: |
          python tools/check_reference_search.py --app $env:CODEVIEW_BUNDLED_APP --output artifacts/semantic-navigation/gui --commit $env:GITHUB_SHA --rounds 1 --semantic --native-aot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: semantic-navigation-${{ matrix.os }}
          retention-days: 14
          path: |
            artifacts/semantic-navigation/environment.txt
            artifacts/semantic-navigation/publish.log
            artifacts/semantic-navigation/*.trx
            artifacts/semantic-navigation/gui/reference-*.json
            artifacts/semantic-navigation/gui/reference-*.log
            artifacts/semantic-navigation/gui/runs.json
